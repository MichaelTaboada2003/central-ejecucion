[package]
name = "dev-command-center"
version = "0.1.0"
description = "Local-first command center for development projects"
authors = ["Dev Command Center"]
edition = "2021"
default-run = "dev-command-center"

[lib]
name = "dev_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
mcp = ["dep:rmcp", "dep:tokio"]

[[bin]]
name = "dev-command-center-mcp"
path = "src/mcp_main.rs"
required-features = ["mcp"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rmcp = { version = "3.1.4", features = ["server", "transport-io", "macros"], optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"], optional = true }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
ureq = { version = "2.10", features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"
